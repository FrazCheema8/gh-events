name: Deploy app
on:
  push:
    branches:
      - dev  
jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint           
      - name: Test code
        run: npm run test        
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build Website
        run: npm run build
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist              
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build articats
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Output build file names
        run: ls    
      - name: Deploy
        run: echo "Deploying"